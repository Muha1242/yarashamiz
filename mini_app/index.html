<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1b0929">
<title>Yarashamiz ❤️</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=7">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

<div id="splash" class="splash-screen" aria-hidden="true">
  <div class="splash-inner">
    <svg class="splash-logo" viewBox="0 0 120 120" fill="none" aria-hidden="true">
      <defs>
        <linearGradient id="lgSplash" x1="0" y1="0" x2="120" y2="120">
          <stop offset="0" stop-color="#ff7aa8"/>
          <stop offset="55%" stop-color="#f7c98b"/>
          <stop offset="100%" stop-color="#a06bff"/>
        </linearGradient>
      </defs>
      <path class="sp-heart"
        d="M60 102C34 84 14 68 14 48c0-13 10-22 21-22 10 0 17 6 25 15 8-9 15-15 25-15 11 0 21 9 21 22 0 20-20 36-46 54z"/>
      <path class="sp-env" d="M27 57h66v41H27z"/>
      <path class="sp-env2" d="M27 57l33 23 33-23"/>
      <circle class="sp-dot" cx="98" cy="26" r="2.4"/>
      <circle class="sp-dot sp-dot2" cx="20" cy="32" r="1.8"/>
      <circle class="sp-dot sp-dot3" cx="104" cy="86" r="1.6"/>
    </svg>
    <div class="splash-brand">Yarashamiz</div>
    <div class="splash-sub">sevgi bilan yozilgan xatlar</div>
    <div class="splash-bar"><i></i></div>
  </div>
</div>

<div class="hearts" aria-hidden="true"></div>

<div id="app" class="app">
  <header class="top">
    <div class="brand">💌 Yarashamiz</div>
    <div class="pill" id="pill">—</div>
  </header>

  <main id="view" class="view"><div class="splash">Yuklanmoqda…</div></main>

  <nav class="tabs" id="tabs">
    <button data-tab="write" class="on">✍️<span>Yozish</span></button>
    <button data-tab="me">📊<span>Hisobim</span></button>
    <button data-tab="games">🎮<span>O'yinlar</span></button>
    <button data-tab="memory">📖<span>Xotiralar</span></button>
    <button data-tab="garden">🌱<span>Bog'im</span></button>
  </nav>
</div>

<canvas id="confetti"></canvas>
<script src="app.js?v=7"></script>
</body>
</html>
