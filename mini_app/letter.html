<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d0010">
<title>Yarashamiz — animatsion xat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat+Brush&family=Caveat:wght@500;700&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* =============================================================================
   QATLAM 0 — DIZAYN TOKENLARI
   Bitta sahifa (spec talabi), ammo JS qatlamlarga bo'lingan:
   Config → Math → Shapes → Particles → Renderer → Scene → UI → Boot
   ========================================================================== */
:root{--bg:#0d0010;--pink:#ff2f8e;--pink-soft:#ff9ac6;--gold:#ffd696;
  --cyan:#1fd6b4;--ink:#fff2f7;--muted:rgba(255,242,247,.62)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg)}
body{font-family:Nunito,system-ui,-apple-system,sans-serif;color:var(--ink);
  padding:env(safe-area-inset-top) env(safe-area-inset-right)
          env(safe-area-inset-bottom) env(safe-area-inset-left);
  background:radial-gradient(120% 70% at 50% 8%,rgba(120,20,90,.55),transparent 62%),
    radial-gradient(90% 60% at 50% 100%,rgba(70,10,110,.45),transparent 70%),var(--bg);
  user-select:none}
#stage{position:fixed;inset:0;display:block;width:100%;height:100%}
.ui{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;pointer-events:none;z-index:2}
/* ---- matn qatlami: FOR YOU, ism, hint ---- */
.foryou{position:absolute;top:calc(50% - 34px);left:50%;transform:translate(-50%,-50%);
  font:700 clamp(22px,6vw,32px)/1 Nunito;letter-spacing:.30em;color:#fff8ee;
  text-transform:uppercase;text-align:center;white-space:nowrap;opacity:0;
  transition:opacity .5s ease;
  text-shadow:0 0 14px rgba(255,190,120,.95),0 0 40px rgba(255,111,174,.55)}
.foryou.on{opacity:1;animation:pulseText 1.9s ease-in-out infinite}
.foryou small{display:block;margin-top:14px;font:600 9.5px Nunito;
  letter-spacing:.36em;color:rgba(255,232,214,.75);text-shadow:none}
@keyframes pulseText{0%,100%{transform:translate(-50%,-50%) scale(1)}
  50%{transform:translate(-50%,-50%) scale(1.045)}}
.name{position:absolute;bottom:calc(50% - 190px);left:0;right:0;text-align:center;
  font-family:'Caveat Brush',Caveat,cursive;font-size:clamp(34px,11vw,58px);
  padding:0 18px;line-height:1.1;
  text-shadow:0 0 20px rgba(255,111,174,.85),0 0 60px rgba(160,107,255,.55)}
.name span{display:inline-block;opacity:0;transform:translateY(10px) scale(.9);
  animation:letterIn .5s cubic-bezier(.2,.9,.2,1) forwards}
@keyframes letterIn{to{opacity:1;transform:none}}
.name.idle{animation:nameGlow 3.4s ease-in-out infinite}
@keyframes nameGlow{0%,100%{filter:brightness(1)}50%{filter:brightness(1.22)}}
.hint{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 112px);left:0;
  right:0;text-align:center;font:600 13px Nunito;color:var(--muted);
  letter-spacing:.04em;padding:0 24px;opacity:0;transition:opacity .6s ease}
.hint.on{opacity:1}
/* ---- tugmalar ---- */
.panel{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 14px);
  z-index:5;display:flex;flex-direction:column;align-items:center;gap:10px;
  padding:0 18px;pointer-events:auto}
.btn{-webkit-appearance:none;appearance:none;border:0;cursor:pointer;width:100%;
  max-width:344px;min-height:52px;border-radius:16px;font:800 16px Nunito;
  display:flex;align-items:center;justify-content:center;gap:8px;
  transition:transform .12s ease,box-shadow .2s ease,opacity .2s ease}
.btn:active{transform:scale(.975)}
.btn-main{color:#2a0016;background:linear-gradient(100deg,#ff8ec0,#ffd08a 55%,#c79bff);
  box-shadow:0 14px 34px rgba(255,111,174,.35)}
.btn-ghost{color:var(--ink);background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.18)}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;gap:8px;width:100%;max-width:344px}
.row .btn{flex:1;min-height:46px;font-size:13px;padding:0 6px}
.hidden{display:none!important}
/* ---- panellar ---- */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:7;max-height:82vh;
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:22px 20px calc(env(safe-area-inset-bottom) + 24px);
  border-radius:26px 26px 0 0;
  background:linear-gradient(180deg,rgba(40,8,56,.98),rgba(16,4,26,.99));
  border-top:1px solid rgba(255,255,255,.14);box-shadow:0 -20px 60px rgba(0,0,0,.6);
  transform:translateY(102%);transition:transform .45s cubic-bezier(.2,.9,.2,1)}
.sheet.on{transform:none}
.sheet h3{margin:0 0 14px;font-family:'Caveat Brush',cursive;font-size:26px;
  color:var(--pink-soft)}
.sheet .meta{font:600 11px Nunito;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);margin-bottom:14px}
.letter-text{font-family:Caveat,cursive;font-size:23px;line-height:1.55;
  white-space:pre-wrap;word-break:break-word;margin:0 0 18px}
.li{padding:12px 14px;margin-bottom:8px;border-radius:14px;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);
  font:600 14px Nunito;color:var(--ink);cursor:pointer}
.flash{position:fixed;inset:0;z-index:4;pointer-events:none;
  background:radial-gradient(circle at 50% 42%,rgba(255,214,240,.95),
    rgba(255,111,174,.55) 42%,transparent 72%);
  animation:flashOut .6s ease-out forwards}
@keyframes flashOut{0%{opacity:0}18%{opacity:.92}100%{opacity:0}}
/* ---- javob tugmalari (xat ostida) ---- */
.answers{display:flex;flex-direction:column;gap:9px;margin:14px 0 8px}
.answers .opt{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:4px}
.answers .opt button{border:1px solid rgba(255,255,255,.2);
  background:rgba(255,255,255,.07);color:var(--ink);border-radius:999px;
  padding:8px 14px;font:700 13px Nunito;cursor:pointer}
.answers .opt button.sel{background:linear-gradient(100deg,#ff8ec0,#ffd08a);
  color:#2a0016;border-color:transparent}
.answers textarea{width:100%;min-height:96px;border-radius:14px;
  border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);
  color:#fff3f7;padding:12px;font:400 15px Nunito;resize:none;margin-bottom:8px}
.answers .danger{color:#ff9a9a}
.tpl-row{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px}
.tpl{flex:0 0 auto;padding:8px 12px;border-radius:999px;cursor:pointer;
  border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);
  font:600 12px Nunito;color:var(--ink);white-space:nowrap}

/* ---- holat toast (yuborilmoqda / xato) ---- */
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 96px);
  transform:translate(-50%,10px);z-index:9;padding:12px 18px;border-radius:14px;
  font:700 13px Nunito;color:#2a0016;background:linear-gradient(100deg,#ffd08a,#ff9ec9);
  box-shadow:0 14px 34px rgba(0,0,0,.45);opacity:0;pointer-events:none;
  transition:opacity .25s ease,transform .25s ease}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.err{background:linear-gradient(100deg,#ff9a9a,#ff6f88);color:#2a0016}

@media (prefers-reduced-motion:reduce){
  .foryou.on,.name.idle{animation:none}
  .name span{animation:none;opacity:1;transform:none}}

/* ---- yuboruvchi qoldirgan syurpriz: "Meni oching" kartasi ---- */
.media-card{
  position:fixed;left:50%;transform:translate(-50%,14px);bottom:calc(env(safe-area-inset-bottom) + 190px);
  z-index:6;width:min(340px,92vw);padding:16px 18px;border-radius:22px;text-align:center;
  background:linear-gradient(160deg,rgba(255,120,180,.22),rgba(160,107,255,.18));
  border:1px solid rgba(255,255,255,.22);
  box-shadow:0 18px 50px rgba(0,0,0,.55),0 0 34px rgba(255,111,174,.35);
  opacity:0;pointer-events:none;transition:opacity .5s ease,transform .5s cubic-bezier(.2,.9,.2,1)}
.media-card.on{opacity:1;transform:translate(-50%,0);pointer-events:auto;
  animation:cardGlow 3s ease-in-out infinite}
@keyframes cardGlow{0%,100%{box-shadow:0 18px 50px rgba(0,0,0,.55),0 0 24px rgba(255,111,174,.28)}
  50%{box-shadow:0 18px 50px rgba(0,0,0,.55),0 0 44px rgba(255,111,174,.55)}}
.media-card h4{margin:0 0 4px;font:800 17px Nunito;letter-spacing:.02em}
.media-card p{margin:0 0 12px;font:600 11.5px Nunito;color:var(--muted);letter-spacing:.03em}
.media-open{width:100%;min-height:46px;border:0;border-radius:14px;cursor:pointer;
  font:800 15px Nunito;color:#2a0016;
  background:linear-gradient(100deg,#ff9ec9,#ffd08a 60%,#c79bff)}
.media-card video,.media-card audio{width:100%;border-radius:14px;margin-top:10px;display:block}
.media-card .m-close{margin-top:8px;background:none;border:0;color:var(--muted);
  font:600 12px Nunito;cursor:pointer}

/* musiqa tugmasidagi ekvalayzer */
.eq{display:inline-flex;align-items:flex-end;gap:2px;height:12px;margin-right:2px}
.eq i{width:2px;background:currentColor;border-radius:2px;animation:eqBounce 1s ease-in-out infinite}
.eq i:nth-child(1){height:5px;animation-delay:0s}
.eq i:nth-child(2){height:11px;animation-delay:.15s}
.eq i:nth-child(3){height:7px;animation-delay:.3s}
@keyframes eqBounce{0%,100%{transform:scaleY(.5)}50%{transform:scaleY(1)}}
</style>
</head>
<body>
<canvas id="stage" aria-hidden="true"></canvas>
<div class="ui">
  <div class="foryou" id="forYou">FOR YOU<small id="forYouSub">sizga yozilgan xat</small></div>
  <div class="name" id="nameBox" aria-live="polite"></div>
  <div class="hint" id="hint">✨ Konvertni bosing</div>
</div>
<div class="panel" id="panel">
  <button class="btn btn-main hidden" id="readBtn">💌 Xatni o'qish</button>
  <div class="row hidden" id="toolsRow">
    <button class="btn btn-ghost" id="replayBtn">🔁 Qayta</button>
    <button class="btn btn-ghost" id="shareBtn">📤 Ulashish</button>
  </div>
  <!-- yuboruvchi qo'ygan video havola: doim "Meni bos" ko'rinishida -->
  <button class="btn btn-main hidden" id="videoBtn">🎁 Meni bos</button>
</div>
<div class="sheet" id="sheet">
  <div class="meta" id="letterMeta"></div>
  <h3>Xat</h3>
  <p class="letter-text" id="letterBody"></p>
  <div class="answers" id="answers"></div>
  <button class="btn btn-ghost" id="closeSheet">Yopish</button>
</div>
<script>
'use strict';
/* =============================================================================
   QATLAM 1 — CONFIG (barcha "sehrli sonlar" shu yerda)
   ========================================================================== */
const Config = Object.freeze({
  MAX_PARTICLES: 800,        // spec: 800 dan oshmasin
  ENVELOPE_VISIBLE: 300,     // konvert fazasida ko'rinadigan "chang"
  STARS: 120,                // yulduzli fon
  FOV: 620,                  // perspektiva masofasi
  SPRING: 0.075,             // prujina qattiqligi
  DAMPING: 0.86,
  DPR_MAX: 2,
  TIMELINE: Object.freeze({
    BURST_MS: 2000,          // 4–6 s: portlash → halqa
    ROSE_MS: 3000,           // 6–9 s: halqa → atirgul
    TOOLS_DELAY_MS: 1800,    // atirguldan keyin tugmalar
  }),
  /* ranglar tema bo'yicha almashadi (Theme.apply) — shuning uchun frozen emas */
  COLORS: {
    petal: '#ff2f8e', petalAlt: '#ff7ab4', cyan: '#1fd6b4', spark: '#ffb45e',
    bg: 'rgba(13,0,16,0.30)', gold: 'rgba(255,214,150,',
    paper: '#fff8f2', star: '#ffffff', frame: 'rgba(255,214,150,',
  },
});
const MAX_PARTICLES = Config.MAX_PARTICLES;   // spec nomi (test bilan mos)
const PHASE = Object.freeze({ ENVELOPE: 0, BURST: 1, ROSE: 2, IDLE: 3 });

/* =============================================================================
   QATLAM 2 — MATH / UTILS
   ========================================================================== */
const MathX = {
  rnd: (a, b) => a + Math.random() * (b - a),
  clamp: (v, a, b) => Math.max(a, Math.min(b, v)),
  lerp: (a, b, t) => a + (b - a) * t,
  polar: (a, r) => [Math.cos(a) * r, Math.sin(a) * r],
};

/* =============================================================================
   QATLAM 3 — SHAKLLAR (shape factory)
   Har bir metod: [[x, y, z, "tur", o'lcham], ...]
   ========================================================================== */
const ShapeFactory = {
  /** Konvert: 4 chekka + 2 qopqoq diagonali + 2 pastki V */
  envelope(n) {
    const bw = Math.min(window.innerWidth * 0.62, 300), bh = bw * 0.66;
    const pts = [];
    const line = (x1, y1, x2, y2, k) => {
      for (let i = 0; i < k; i++) {
        const t = k > 1 ? i / (k - 1) : 0;
        pts.push([MathX.lerp(x1, x2, t), MathX.lerp(y1, y2, t), MathX.rnd(-8, 8)]);
      }
    };
    const k = Math.max(20, Math.floor(n / 6.4));
    line(-bw / 2, -bh / 2, bw / 2, -bh / 2, k);
    line(-bw / 2, bh / 2, bw / 2, bh / 2, k);
    line(-bw / 2, -bh / 2, -bw / 2, bh / 2, k);
    line(bw / 2, -bh / 2, bw / 2, bh / 2, k);
    line(-bw / 2, -bh / 2, 0, bh * 0.06, Math.floor(k * 0.7));
    line(bw / 2, -bh / 2, 0, bh * 0.06, Math.floor(k * 0.7));
    line(-bw / 2, bh / 2, 0, bh * 0.06, Math.floor(k * 0.5));
    line(bw / 2, bh / 2, 0, bh * 0.06, Math.floor(k * 0.5));
    return pts.slice(0, n);
  },

  /** Halqa: yotgan ellips (3D) */
  ring(n) {
    const R = Math.min(window.innerWidth * 0.34, 170);
    return Array.from({ length: n }, (_, i) => {
      const a = (i / n) * Math.PI * 2;
      return [Math.cos(a) * R, Math.sin(a) * R * 0.42, Math.sin(a) * 26];
    });
  },

  /** Atirgul: kurtak + 4 qatlam gulbarg + cyan poya/barg */
  rose(n) {
    const out = [];
    const R = Math.min(window.innerWidth * 0.235, 118);
    const buds = Math.floor(n * 0.18);
    for (let i = 0; i < buds; i++) {
      const u = i / buds, th = u * Math.PI * 2 * 2.4, rr = (0.08 + u * 0.30) * R;
      out.push([Math.cos(th) * rr, Math.sin(th) * rr * 0.92 - R * 0.20,
                (1 - u) * R * 0.22, 'petal', MathX.rnd(1.0, 1.6)]);
    }
    const layers = [
      { k: 5, r: 0.46, z: 0.34, dy: -0.10 }, { k: 7, r: 0.66, z: 0.16, dy: -0.02 },
      { k: 9, r: 0.86, z: -0.02, dy: 0.06 }, { k: 11, r: 1.00, z: -0.20, dy: 0.14 },
    ];
    const petalPts = n - buds - Math.floor(n * 0.12) - Math.floor(n * 0.10);
    for (const L of layers) {
      const per = Math.max(6, Math.floor(petalPts / layers.length / L.k));
      for (let p = 0; p < L.k; p++) {
        const a0 = (p / L.k) * Math.PI * 2 + L.k * 0.13;
        for (let s = 0; s < per; s++) {
          const t = per > 1 ? s / (per - 1) : 0.5;
          const a = a0 + (t - 0.5) * (Math.PI * 1.35 / L.k);
          const rr = R * L.r * (0.80 + 0.20 * Math.sin(Math.PI * t));
          out.push([Math.cos(a) * rr, Math.sin(a) * rr * 0.88 + R * L.dy,
                    R * L.z + Math.sin(Math.PI * t) * R * 0.16,
                    'petal', MathX.rnd(0.9, 1.5)]);
        }
      }
    }
    const top = R * 0.98, stem = Math.floor(n * 0.12);
    for (let i = 0; i < stem; i++) {
      const t = i / stem;
      out.push([Math.sin(t * 2.1) * R * 0.12, top + t * R * 1.20,
                Math.cos(t * 2.0) * 8, 'stem', MathX.rnd(0.9, 1.4)]);
    }
    const leaf = n - out.length;
    for (let i = 0; i < leaf; i++) {
      const side = i % 2 ? 1 : -1, t = (i / Math.max(1, leaf / 2)) * Math.PI;
      const lr = R * 0.28;
      out.push([side * (R * 0.18 + Math.sin(t) * lr * 0.95),
                top + R * 0.45 + Math.cos(t) * lr * 0.30,
                Math.sin(t) * 6, 'leaf', MathX.rnd(0.8, 1.2)]);
    }
    return out;
  },
};
const envelopeShape = (n) => ShapeFactory.envelope(n);
const ringShape = (n) => ShapeFactory.ring(n);
const roseShape = (n) => ShapeFactory.rose(n);

/* =============================================================================
   QATLAM 3b — TEMALAR (har bir xat mavzusi uchun o'z foni, konverti, teksturasi)
   Bu yerda "sehrli sonlar" yo'q — ranglar Theme ga yoziladi va ishlatiladi.
   ========================================================================== */
const THEMES = {
  classic: { bg: ['#1a0a24', '#0d0010'], env: ['#7a3a86', '#4a1d5c'],
    line: 'rgba(255,214,150,.85)', paper: '#fff8f2', tex: 'plain', ink: '#4a2b3a',
    star: '#ffffff', parts: ['#ff2f8e', '#ff7ab4', '#1fd6b4', '#ffb45e'],
    frame: 'rgba(255,214,150,', glow: 'rgba(255,111,174,' },
  love: { bg: ['#3d0a20', '#160310'], env: ['#c2185b', '#6d0f36'],
    line: 'rgba(255,180,200,.9)', paper: '#fff2f5', tex: 'plain', ink: '#7a1735',
    star: '#ffd9e6', parts: ['#ff2f8e', '#ff6ba6', '#ffd696', '#ff9ec9'],
    frame: 'rgba(255,140,170,', glow: 'rgba(255,47,142,' },
  sunset: { bg: ['#4a1f08', '#1a0a04'], env: ['#e0703a', '#8a3a16'],
    line: 'rgba(255,220,160,.9)', paper: '#fff6ea', tex: 'grain', ink: '#6b3a1a',
    star: '#ffe0b8', parts: ['#ff8a4c', '#ffb45e', '#ffd696', '#ff5e8a'],
    frame: 'rgba(255,190,120,', glow: 'rgba(255,150,90,' },
  mint: { bg: ['#0a2a20', '#04120c'], env: ['#2f9e78', '#155e45'],
    line: 'rgba(180,255,225,.85)', paper: '#f2fff9', tex: 'grain', ink: '#1c5540',
    star: '#d8fff0', parts: ['#3ddfae', '#8af5d0', '#ffd696', '#1fd6b4'],
    frame: 'rgba(140,255,215,', glow: 'rgba(61,223,174,' },
  /* --- bepul: marmar — oq shtrixli konvert, ichidan marmar qog'oz chiqadi --- */
  marmar: { bg: ['#dfe8f5', '#aab8cf'], env: ['#ffffff', '#c9d7ef'],
    line: 'rgba(90,110,140,.65)', paper: '#f8fbff', tex: 'marble', ink: '#243044',
    star: '#ffffff', parts: ['#5b7bb8', '#93a9d6', '#c2a06a', '#7f95c9'],
    frame: 'rgba(120,145,190,', glow: 'rgba(140,165,215,' },
  /* --- premium --- */
  night: { bg: ['#0a1030', '#04060f'], env: ['#26347a', '#111a45'],
    line: 'rgba(160,190,255,.9)', paper: '#eef2ff', tex: 'stars', ink: '#1b2450',
    star: '#cfe0ff', parts: ['#6f8fff', '#a8c0ff', '#ffd696', '#8f6bff'],
    frame: 'rgba(150,175,255,', glow: 'rgba(111,143,255,' },
  gold: { bg: ['#3a2c08', '#140f03'], env: ['#c9a227', '#7a6112'],
    line: 'rgba(255,235,170,.95)', paper: '#fffbe8', tex: 'grain', ink: '#6a5210',
    star: '#ffe9a8', parts: ['#ffd696', '#ffe9a8', '#fff4d0', '#e0a83a'],
    frame: 'rgba(255,215,80,', glow: 'rgba(255,200,80,' },
  ocean: { bg: ['#04263f', '#020c16'], env: ['#1b7fb8', '#0a4468'],
    line: 'rgba(170,235,255,.9)', paper: '#eefaff', tex: 'waves', ink: '#0a3a55',
    star: '#cdeeff', parts: ['#3fd0ff', '#8ae5ff', '#ffd696', '#1fd6b4'],
    frame: 'rgba(140,220,255,', glow: 'rgba(63,208,255,' },
  royal: { bg: ['#2a0a40', '#12031c'], env: ['#7a1fb8', '#44106b'],
    line: 'rgba(255,215,255,.9)', paper: '#f9f0ff', tex: 'plain', ink: '#4a1670',
    star: '#efd8ff', parts: ['#b06bff', '#e0a8ff', '#ffd696', '#ff5ea8'],
    frame: 'rgba(220,170,255,', glow: 'rgba(176,107,255,' },
  aurora: { bg: ['#062a2c', '#041018'], env: ['#1f8a8a', '#3a2f8a'],
    line: 'rgba(160,255,240,.9)', paper: '#eefffd', tex: 'aurora', ink: '#15555c',
    star: '#c8fff4', parts: ['#3fe0c8', '#8a6bff', '#ffd696', '#5ee8b8'],
    frame: 'rgba(130,255,235,', glow: 'rgba(63,224,200,' },
  blossom: { bg: ['#3d0a24', '#160410'], env: ['#e06a9a', '#94305c'],
    line: 'rgba(255,225,235,.95)', paper: '#fff4f8', tex: 'petals', ink: '#8a2a50',
    star: '#ffd9e6', parts: ['#ff8ab4', '#ffc2d6', '#ffd696', '#ffe0ea'],
    frame: 'rgba(255,170,200,', glow: 'rgba(255,138,180,' },

const Theme = {
  key: 'classic', d: THEMES.classic,
  pick(k) {
    this.key = (k && THEMES[k]) ? k : 'classic';
    this.d = THEMES[this.key];
    this.apply();
  },
  /** Konfiguratsiya + sahifaning foni bir zumda almashadi */
  apply() {
    const t = this.d;
    Config.COLORS.petal = t.parts[0];
    Config.COLORS.petalAlt = t.parts[1];
    Config.COLORS.cyan = t.parts[2];
    Config.COLORS.spark = t.parts[3];
    Config.COLORS.gold = t.frame;
    Config.COLORS.frame = t.frame;
    Config.COLORS.glow = t.glow;
    Config.COLORS.paper = t.paper;
    Config.COLORS.star = t.star;
    /* yengil temalar (marmar/qog'oz) uchun qorong'i overlay o'rniga yorug'i */
    const light = this.light();
    Config.COLORS.bg = light ? 'rgba(255,255,255,0.16)' : 'rgba(8,0,14,0.30)';
    try {
      const s = document.documentElement.style;
      s.setProperty('--bg', t.bg[1]);
      s.setProperty('--tbg1', t.bg[0]);
      s.setProperty('--tbg2', t.bg[1]);
      s.setProperty('--tenv1', t.env[0]);
      s.setProperty('--tenv2', t.env[1]);
      s.setProperty('--tline', t.line);
      s.setProperty('--tink', t.ink);
      s.setProperty('--tglow', t.glow + '.55)');   // 'rgba(r,g,b,' + alfa
      s.setProperty('--pink', t.parts[0]);        // tugmalar aksenti temaga mos
      s.setProperty('--pink-soft', t.parts[1]);
      s.setProperty('--cyan', t.parts[2]);
      s.setProperty('--gold', t.parts[1]);
      s.setProperty('--ink', light ? t.ink : '#fff2f7');
      s.setProperty('--muted', light ? 'rgba(36,48,68,.66)' : 'rgba(255,242,247,.62)');
      document.body.style.background =
        'radial-gradient(120% 70% at 50% 8%, ' + t.bg[0] + 'ee, transparent 62%),' +
        'radial-gradient(90% 60% at 50% 100%, ' + t.bg[1] + 'cc, transparent 70%),' +
        'linear-gradient(180deg, ' + t.bg[0] + ', ' + t.bg[1] + ')';
      document.body.style.color = light ? t.ink : '';
      const mc = document.querySelector('meta[name=theme-color]');
      if (mc) mc.content = t.bg[1];
      const fb = document.querySelector('meta[name=light-color]');
      if (fb) fb.content = t.bg[1];
    } catch (e) { /* jim */ }
  },
  /** Yorug' fonli tema? (matn va effekt rangini o'zgartiradi) */
  light() { return this.key === 'marmar' || this.key === 'paper'; },
};

/* Bot havolasi `?d=<base64url JSON {t,o,theme,n}>` bilan ham ishlaydi */
function decodeBotPayload() {
  const raw = Q.get('d');
  if (!raw) return;
  try {
    const json = atob(raw.replace(/-/g, '+').replace(/_/g, '/'));
    const d = JSON.parse(json);
    if (d.t) params.text = String(d.t).slice(0, 1000);
    if (d.theme) params.theme = String(d.theme).slice(0, 20);
    if (d.n) params.name = String(d.n).slice(0, 40);
    if (Array.isArray(d.o)) {
      params.offers = d.o.map(String).filter(Boolean).slice(0, 9);
    }
    if (d.ts) params.ts = Number(d.ts) || 0;
  } catch (e) { /* buzilgan payload — jim o'tamiz */ }
}

const Viewport = {
  W: 0, H: 0, DPR: 1, cx: 0, cy: 0,
  resize() {
    this.DPR = Math.min(window.devicePixelRatio || 1, Config.DPR_MAX);
    this.W = window.innerWidth; this.H = window.innerHeight;
    CANVAS.width = Math.floor(this.W * this.DPR);
    CANVAS.height = Math.floor(this.H * this.DPR);
    CANVAS.style.width = this.W + 'px';
    CANVAS.style.height = this.H + 'px';
    ctx.setTransform(this.DPR, 0, 0, this.DPR, 0, 0);
    this.cx = this.W / 2;
    this.cy = this.H * 0.44;
  },
};

class StarField {
  constructor(count) {
    this.stars = Array.from({ length: count }, () => ({
      x: Math.random(), y: Math.random(),
      r: MathX.rnd(0.4, 1.5), p: Math.random() * Math.PI * 2,
    }));
  }
  draw(t) {
    const { W, H } = Viewport;
    const star = (Config.COLORS && Config.COLORS.star) || '#ffffff';
    for (let i = 0; i < this.stars.length; i++) {
      const s = this.stars[i];
      const tw = 0.35 + 0.65 * Math.abs(Math.sin(t * 0.0012 + s.p));
      ctx.globalAlpha = tw * 0.7;
      ctx.fillStyle = star;
      ctx.beginPath(); ctx.arc(s.x * W, s.y * H, s.r, 0, 6.2832); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
}
const stars = new StarField(Config.STARS);

/* =============================================================================
   QATLAM 7b — KONVERT YUZASI va TEMATIK QOG'OZ
   Konvert bosilganda: yorqin yaltirash → old tomon ochiladi → ichidan
   tanlangan mavzudagi qog'oz chiqadi (marmar shtrixlari, qog'oz tolalari…)
   ========================================================================== */
const Paper = {
  /** Joriy teksturani beradi */
  tex() { return (Theme.d && Theme.d.tex) || 'plain'; },

  /** Tekstura naqshini chizish (marmar/ohlak/gullar va boshqalar) */
  draw(ctx2, x, y, w, h, seed) {
    const kind = this.tex();
    if (kind === 'plain') return;
    ctx2.save();
    ctx2.beginPath(); ctx2.rect(x, y, w, h); ctx2.clip();
    let i = (seed || 0) * 977;
    const rnd = () => { i = (i * 16807) % 2147483647; return i / 2147483647; };
    if (kind === 'marble') {                    // marmar shtrixlari
      for (let k = 0; k < 26; k++) {
        ctx2.strokeStyle = 'rgba(' + (140 + ((rnd() * 60) | 0)) + ',' +
          (155 + ((rnd() * 50) | 0)) + ',' + (185 + ((rnd() * 45) | 0)) + ',' +
          (0.10 + rnd() * 0.22) + ')';
        ctx2.lineWidth = 0.6 + rnd() * 2.4;
        ctx2.beginPath();
        let px = x - 20 + rnd() * w, py = y + rnd() * h;
        ctx2.moveTo(px, py);
        for (let s = 0; s < 7; s++) {
          px += (w / 6) * (0.5 + rnd() * 0.9);
          py += (rnd() - 0.5) * 42;
          ctx2.quadraticCurveTo(px - 22, py + (rnd() - 0.5) * 34, px, py);
        }
        ctx2.stroke();
      }
    } else if (kind === 'fiber') {               // qog'oz tolalari
      ctx2.strokeStyle = 'rgba(140,110,60,.14)';
      for (let k = 0; k < 150; k++) {
        ctx2.lineWidth = 0.5 + rnd();
        const fx = x + rnd() * w, fy = y + rnd() * h, l = 4 + rnd() * 14;
        ctx2.beginPath();
        ctx2.moveTo(fx, fy);
        ctx2.lineTo(fx + (rnd() - 0.5) * l, fy + (rnd() - 0.5) * l);
        ctx2.stroke();
      }
    } else if (kind === 'grain') {               // nozik donador
      ctx2.fillStyle = 'rgba(255,255,255,.10)';
      for (let k = 0; k < 420; k++) {
        ctx2.fillRect(x + rnd() * w, y + rnd() * h, 1.2, 1.2);
      }
      ctx2.fillStyle = 'rgba(0,0,0,.07)';
      for (let k = 0; k < 240; k++) {
        ctx2.fillRect(x + rnd() * w, y + rnd() * h, 1.1, 1.1);
      }
    } else if (kind === 'neon') {                // neon chiziqlar
      ctx2.globalCompositeOperation = 'lighter';
      for (let k = 0; k < 8; k++) {
        const g = ctx2.createLinearGradient(x, y, x + w, y + h);
        g.addColorStop(0, 'rgba(255,47,142,0)');
        g.addColorStop(0.5, 'rgba(90,255,240,.20)');
        g.addColorStop(1, 'rgba(176,107,255,0)');
        ctx2.strokeStyle = g; ctx2.lineWidth = 1.6;
        ctx2.beginPath();
        ctx2.moveTo(x - 20, y + rnd() * h);
        ctx2.lineTo(x + w + 20, y + rnd() * h);
        ctx2.stroke();
      }
      ctx2.globalCompositeOperation = 'source-over';
    } else if (kind === 'stars') {               // tun yulduzlari
      ctx2.fillStyle = 'rgba(255,255,255,.65)';
      for (let k = 0; k < 90; k++) {
        const r = 0.6 + rnd() * 1.6;
        ctx2.beginPath();
        ctx2.arc(x + rnd() * w, y + rnd() * h, r, 0, 6.2832);
        ctx2.fill();
      }
    } else if (kind === 'waves') {               // dengiz to'lqinlari
      ctx2.strokeStyle = 'rgba(120,220,255,.22)';
      for (let k = 0; k < 14; k++) {
        ctx2.lineWidth = 1 + rnd();
        const wy = y + (k / 14) * h;
        ctx2.beginPath();
        for (let px = x - 10; px < x + w + 10; px += 6) {
          const yy = wy + Math.sin((px - x) * 0.06 + k) * 7;
          if (px === x - 10) ctx2.moveTo(px, yy); else ctx2.lineTo(px, yy);
        }
        ctx2.stroke();
      }
    } else if (kind === 'aurora') {              // shimol yog'dusi
      for (let k = 0; k < 6; k++) {
        const g = ctx2.createLinearGradient(x, y + k * 40, x + w, y + k * 40 + 60);
        g.addColorStop(0, 'rgba(63,224,200,.16)');
        g.addColorStop(0.5, 'rgba(138,107,255,.16)');
        g.addColorStop(1, 'rgba(63,224,200,0)');
        ctx2.fillStyle = g;
        ctx2.fillRect(x, y + k * 46, w, 60);
      }
    } else if (kind === 'petals') {              // sepilgan gulbarglar
      for (let k = 0; k < 26; k++) {
        ctx2.fillStyle = 'rgba(255,180,205,' + (0.16 + rnd() * 0.22) + ')';
        const px = x + rnd() * w, py = y + rnd() * h, r = 3 + rnd() * 7;
        ctx2.beginPath();
        ctx2.ellipse(px, py, r, r * 0.55, rnd() * 6.28, 0, 6.2832);
        ctx2.fill();
      }
    } else if (kind === 'clouds') {              // bulutlar
      for (let k = 0; k < 14; k++) {
        ctx2.fillStyle = 'rgba(255,255,255,' + (0.10 + rnd() * 0.14) + ')';
        const cx = x + rnd() * w, cy = y + rnd() * h;
        for (let b = 0; b < 5; b++) {
          ctx2.beginPath();
          ctx2.arc(cx + (rnd() - 0.5) * 46, cy + (rnd() - 0.5) * 16,
                   8 + rnd() * 15, 0, 6.2832);
          ctx2.fill();
        }
      }
    }
    ctx2.restore();
  },

  /** Konvert ichidan chiqqan qog'oz varaq — "bu xat" deb o'qiladigan qisqa lahza.
   *  t: BURST boshidan beri ms — 0–260 o'sadi, 260–800 turadi, 800–1200 so'nadi */
  sheet(t) {
    if (t <= 0 || t > 1200) return;
    let a = 1, grow = 1;
    if (t < 260) a = grow = MathX.clamp(t / 260, 0, 1);
    else if (t > 800) a = MathX.clamp(1 - (t - 800) / 400, 0, 1);
    if (a <= 0) return;
    const t2 = Theme.d;
    const bw = Math.min(Viewport.W * 0.62, 300) * (0.62 + 0.30 * grow);
    const bh = bw * 0.68;
    const x = Viewport.cx - bw / 2, y = Viewport.cy - bh / 2 - 22 * grow;
    const rot = (1 - grow) * 0.20;
    ctx.save();
    ctx.globalAlpha = a * 0.92;
    ctx.translate(Viewport.cx, Viewport.cy);
    ctx.rotate(rot);
    ctx.translate(-Viewport.cx, -Viewport.cy);
    ctx.shadowColor = 'rgba(0,0,0,.26)';   // yengil soya — "quti" emas, "qog'oz"
    ctx.shadowBlur = 30;
    ctx.shadowOffsetY = 8;
    const g = ctx.createLinearGradient(x, y, x + bw, y + bh);
    g.addColorStop(0, '#ffffff');
    g.addColorStop(0.35, t2.paper);
    g.addColorStop(1, t2.paper);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(x, y); ctx.lineTo(x + bw, y);
    ctx.lineTo(x + bw, y + bh); ctx.lineTo(x, y + bh); ctx.closePath();
    ctx.fill();
    ctx.shadowColor = 'transparent';
    ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
    ctx.clip();
    Paper.draw(ctx, x, y, bw, bh, 7);      // mavzu teksturasi (marmar shtrixlari…)
    /* yozuv chiziqlari — to'rtburchak emas, xat deb o'qinsin */
    ctx.strokeStyle = t2.line;
    ctx.lineWidth = Math.max(1, bw * 0.008);
    ctx.globalAlpha = a * 0.5;
    for (let i = 1; i <= 6; i++) {
      const ly = y + bh * (0.20 + i * 0.105);
      ctx.beginPath();
      ctx.moveTo(x + bw * 0.12, ly);
      ctx.lineTo(x + bw * (i === 6 ? 0.58 : 0.88), ly);
      ctx.stroke();
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  },
};

/* =============================================================================
   QATLAM 7 — EFFEKTLAR: oltin ramka, yurak portlashi, halqa, chaqnash, ovoz
   ========================================================================== */
const Fx = {
  heart: 0, ring: 0, rays: 0, sparks: [],

  goldFrame(t) {
    const bw = Math.min(Viewport.W * 0.62, 300), bh = bw * 0.66;
    const x = Viewport.cx - bw / 2, y = Viewport.cy - bh / 2;
    const pulse = 0.55 + 0.45 * Math.sin(t * 0.003);
    ctx.save();
    ctx.lineWidth = 1.4;
    ctx.strokeStyle = Config.COLORS.gold + (0.35 + 0.35 * pulse) + ')';
    ctx.shadowColor = Config.COLORS.glow + '.9)';
    ctx.shadowBlur = 18 + 10 * pulse;
    ctx.beginPath();
    ctx.moveTo(x, y); ctx.lineTo(x + bw, y);
    ctx.lineTo(x + bw, y + bh); ctx.lineTo(x, y + bh); ctx.closePath();
    ctx.moveTo(x, y); ctx.lineTo(Viewport.cx, y + bh * 0.42);
    ctx.lineTo(x + bw, y);
    ctx.stroke();
    ctx.restore();
    ctx.globalAlpha = 1;
  },

  burst(n, power) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = MathX.rnd(1.4, 5.2) * power;
      this.sparks.push({ x: 0, y: 0, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
                         life: 1, s: MathX.rnd(1, 2.6) });
    }
    if (this.sparks.length > 260) this.sparks.splice(0, this.sparks.length - 260);
  },

  hearts(dt) {
    if (Math.random() < dt * 6) {
      this.sparks.push({ x: MathX.rnd(-Viewport.W * 0.32, Viewport.W * 0.32),
                         y: MathX.rnd(40, 160), vx: MathX.rnd(-0.25, 0.25),
                         vy: MathX.rnd(-1.1, -0.55), life: 1.4,
                         s: MathX.rnd(1.6, 3.1) });
    }
  },

  draw(dt) {
    const cx = Viewport.cx, cy = Viewport.cy;
    if (this.heart > 0) {
      const k = 1 - this.heart / 1.1, s = 40 + k * 120;
      const a = Math.max(0, 1 - k) * 0.85;
      const g = ctx.createRadialGradient(cx, cy - 10, 0, cx, cy - 10, s * 1.6);
      const gl = Config.COLORS.glow || 'rgba(255,111,174,';
      g.addColorStop(0, gl + a + ')');
      g.addColorStop(0.45, gl + (a * 0.55) + ')');
      g.addColorStop(1, gl + '0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(cx, cy - 10, s * 1.6, 0, 6.2832); ctx.fill();
    }
    if (this.ring > 0) {
      const k = 1 - this.ring / 1.5, r = 30 + k * 190;
      ctx.strokeStyle = (Config.COLORS.glow || 'rgba(255,90,160,') +
        Math.max(0, 1 - k) * 0.85 + ')';
      ctx.lineWidth = Math.max(1.2, 6 * (1 - k));
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, 6.2832); ctx.stroke();
    }
    for (let i = this.sparks.length - 1; i >= 0; i--) {
      const s = this.sparks[i];
      s.x += s.vx * dt * 60; s.y += s.vy * dt * 60;
      s.vx *= 0.965; s.vy *= 0.965; s.life -= dt * 0.9;
      if (s.life <= 0) { this.sparks.splice(i, 1); continue; }
      ctx.globalAlpha = MathX.clamp(s.life, 0, 1) * 0.9;
      ctx.fillStyle = s.life > 0.6
        ? ((Config.COLORS.star || '#ffffff'))
        : (Config.COLORS.petalAlt || '#ff9ac6');
      ctx.beginPath(); ctx.arc(cx + s.x, cy + s.y, s.s, 0, 6.2832); ctx.fill();
    }
    ctx.globalAlpha = 1;

    /* --- yorug'lik nurlari: konvert ochilganda markazdan tarqaladi --- */
    if (this.rays > 0) {
      const k = MathX.clamp(1 - this.rays / 0.95, 0, 1);
      const a = Math.max(0, 1 - k) * 0.5;
      const gl = Config.COLORS.glow || 'rgba(255,200,120,';
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.translate(cx, cy);
      for (let i = 0; i < 20; i++) {
        const ang = (i / 20) * Math.PI * 2 + k * 0.9;
        const len = 140 + k * Math.max(Viewport.W, Viewport.H);
        const g = ctx.createLinearGradient(0, 0, Math.cos(ang) * len,
                                           Math.sin(ang) * len);
        g.addColorStop(0, gl + (a * 0.85) + ')');
        g.addColorStop(0.35, gl + (a * 0.3) + ')');
        g.addColorStop(1, gl + '0)');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.arc(0, 0, len, ang - 0.045, ang + 0.045);
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();
    }
  },

  flash() {
    const el = document.createElement('div');
    el.className = 'flash';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 620);
  },
};
const flashScreen = () => Fx.flash();
const heartsTick = (dt) => Fx.hearts(dt);
const drawGoldFrame = (t) => Fx.goldFrame(t);
const burstSparks = (n, p) => Fx.burst(n, p);

/* =============================================================================
   QATLAM 8 — ZARRACHALAR TIZIMI (prujina fizikasi, 3D → 2D proyeksiya)
   ========================================================================== */
class ParticleSystem {
  constructor(n) {
    this.n = Math.min(n, Config.MAX_PARTICLES);
    this.parts = [];
    this.reset();
  }
  reset() {
    this.parts = Array.from({ length: this.n }, () => ({
      x: MathX.rnd(-40, 40), y: MathX.rnd(-40, 40), z: MathX.rnd(-40, 40),
      tx: 0, ty: 0, tz: 0, vx: 0, vy: 0, vz: 0,
      b: 0, s: MathX.rnd(1.1, 2.4), hidden: false,
    }));
  }
  /** Shaklni biriktirish; `impulse` — portlash kuchi */
  applyShape(shape, impulse) {
    for (let i = 0; i < this.n; i++) {
      const p = this.parts[i];
      const s = shape[i % shape.length];
      p.tx = s[0]; p.ty = s[1]; p.tz = s[2] || 0;
      const type = s[3] || 'petal';
      p.hidden = false;
      p.b = (type === 'stem' || type === 'leaf') ? 2 : (i % 3 === 0 ? 1 : 0);
      p.s = s[4] || MathX.rnd(1.1, 2.4);
      if (impulse) {
        const d = Math.hypot(p.tx, p.ty) || 1;
        p.vx += (p.tx / d) * impulse + MathX.rnd(-2, 2);
        p.vy += (p.ty / d) * impulse + MathX.rnd(-2, 2);
        p.vz += MathX.rnd(-6, 6);
      }
    }
  }
  /** Konvert fazasida ortiqcha zarrachalarni yashirish (toza ko'rinish) */
  hideFrom(k) {
    for (let i = k; i < this.n; i++) this.parts[i].hidden = true;
  }
  /** dt bilan fizika: har bir zarracha o'z maqsadi tomon (3D aylantirilgan) */
  step(dt, rotY, rotX) {
    const cosY = Math.cos(rotY), sinY = Math.sin(rotY);
    const cosX = Math.cos(rotX), sinX = Math.sin(rotX);
    for (let i = 0; i < this.n; i++) {
      const p = this.parts[i];
      if (p.hidden) continue;
      const tx = p.tx * cosY - p.tz * sinY;
      const tz0 = p.tx * sinY + p.tz * cosY;
      const ty = p.ty * cosX - tz0 * sinX;
      const tz = p.ty * sinX + tz0 * cosX;
      p.vx = (p.vx + (tx - p.x) * Config.SPRING) * Config.DAMPING;
      p.vy = (p.vy + (ty - p.y) * Config.SPRING) * Config.DAMPING;
      p.vz = (p.vz + (tz - p.z) * Config.SPRING) * Config.DAMPING;
      p.x += p.vx * dt * 60; p.y += p.vy * dt * 60; p.z += p.vz * dt * 60;
    }
  }
}

const Particles = new ParticleSystem(Config.MAX_PARTICLES);

/* =============================================================================
   QATLAM 9 — RENDERER (bir kadr: fon → yulduzlar → ramka → FX → zarrachalar)
   ========================================================================== */
class Renderer {
  draw(dt) {
    const { W, H, cx, cy } = Viewport;
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = Config.COLORS.bg;
    ctx.fillRect(0, 0, W, H);
    drawStars(Director.elapsed);
    if (Director.phase === PHASE.ENVELOPE) {
      drawGoldFrame(Director.elapsed);
    } else if (Director.phase === PHASE.BURST) {
      /* konvert ochilmoqda: ichidan mavzudagi qog'oz varaq chiqadi va
         zarrachalarga so'nadi (oq quticha emas — xat ko'rinishida) */
      const bt = Director.elapsed - Director.phaseStart;
      Paper.sheet(bt);
      if (bt < 460) drawGoldFrame(Director.elapsed);
    }
    Fx.draw(dt);

    ctx.globalCompositeOperation = 'lighter';
    const fov = Config.FOV;
    for (const p of Particles.parts) {
      if (p.hidden) continue;
      const sc = fov / (fov + p.z);
      const sx = cx + p.x * sc, sy = cy + p.y * sc;
      if (sx < -24 || sx > W + 24 || sy < -24 || sy > H + 24) continue;
      ctx.globalAlpha = MathX.clamp(0.20 + sc * 0.34, 0.10, 0.58);
      ctx.fillStyle = [Config.COLORS.petal, Config.COLORS.petalAlt,
                       Config.COLORS.cyan, Config.COLORS.spark][p.b];
      ctx.beginPath();
      ctx.arc(sx, sy, MathX.clamp(p.s * sc, 0.6, 4.2), 0, 6.2832);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }
}
const renderer = new Renderer();

/* =============================================================================
   QATLAM 10 — SCENE DIRECTOR (holatlar mashinasi va timeline)
   0–4s konvert → 4–6s portlash/halqa → 6–9s atirgul → 9s+ ism → idle
   ========================================================================== */
const Director = {
  phase: PHASE.ENVELOPE, started: false, finished: false,
  elapsed: 0, phaseStart: 0, last: 0,
  rotY: -0.35, rotX: 0, targetRotX: 0, spin: 0, dragSpin: 0,
  dragging: false, lastX: 0, lastY: 0,

  /** Bosilganda: konvert → portlash → halqa → atirgul */
  start() {
    if (this.started) return;
    this.started = true;
    this.phase = PHASE.BURST;
    this.phaseStart = this.elapsed;
    UI.hint.classList.remove('on');
    UI.forYou.classList.remove('on');
    Particles.applyShape(ringShape(Particles.n), 9);
    Fx.burst(120, 1);
    Fx.heart = 1.1;
    Fx.ring = 1.5;
    Fx.rays = 0.95;              // markazdan yorug'lik nurlari tarqaladi
    openChime();
    flashScreen();
    if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('heavy');
    setTimeout(() => Fx.burst(60, 0.7), Config.TIMELINE.BURST_MS * 0.6);
  },

  /** Bitta kadr */
  frame(ts) {
    if (!this.last) this.last = ts;
    const dt = Math.min(0.05, (ts - this.last) / 1000);
    this.last = ts;
    this.elapsed += dt * 1000;

    if (this.started && !this.finished) {
      const t = this.elapsed - this.phaseStart;
      if (this.phase === PHASE.BURST && t > Config.TIMELINE.BURST_MS) {
        this.phase = PHASE.ROSE; this.phaseStart = this.elapsed;
        Particles.applyShape(roseShape(Particles.n), 0);
      } else if (this.phase === PHASE.ROSE && t > Config.TIMELINE.ROSE_MS) {
        this.phase = PHASE.IDLE; this.phaseStart = this.elapsed;
        revealName();
        Fx.rays = 0.6;           // ism chiqqanda yana bir yaltirash
        Fx.burst(40, 0.8);
      }
      if (this.phase === PHASE.IDLE && !this.finished &&
          this.elapsed - this.phaseStart > Config.TIMELINE.TOOLS_DELAY_MS) {
        this.finished = true;
        showTools();
      }
    }

    this.rotY += (this.spin + this.dragSpin) * dt;
    this.dragSpin *= 0.94;
    this.rotX += (this.targetRotX - this.rotX) * 0.08;
    if (Fx.heart > 0) Fx.heart -= dt;
    if (Fx.ring > 0) Fx.ring -= dt;
    if (Fx.rays > 0) Fx.rays -= dt;
    if (this.phase === PHASE.ROSE || this.phase === PHASE.IDLE) heartsTick(dt);

    Particles.step(dt, this.rotY, this.rotX);
    renderer.draw(dt);
    requestAnimationFrame((t) => this.frame(t));
  },
};

const startAnimation = () => Director.start();

/** Faqat `?l=` bo'lsa — xatni serverdan yuklaymiz (initData bilan) */
async function loadFromServer() {
  if (!params.letterId || params.text || !tg || !tg.initData) return;
  try {
    const res = await fetch('/api/app', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ init: tg.initData, action: 'letter',
                             l: Number(params.letterId) }),
    });
    const j = await res.json();

      params.theme = j.theme || params.theme;
      Theme.pick(params.theme);      // serverdagi mavzuni DARHOL qo'llash
      params.ts = Number(j.ts || params.ts) || 0;
      if (Array.isArray(j.offers)) params.offers = j.offers.map(String).slice(0, 9);
      if (!params.name) params.name = j.mine ? '' : (j.fromName || '');
      UI.forYouSub.textContent = params.name ? ('sizga: ' + params.name)
                                             : 'sizga yozilgan xat';
    }
  } catch (e) { /* jim */ }
}

/** "Kimdan: X · 2 kun oldin yozilgan" */
function letterMetaText() {
  const parts = [];
  if (params.name) parts.push('Kimdan: ' + params.name);
  else parts.push('Sizga yozilgan xat');
  if (params.ts) {
    const diff = Math.max(0, Date.now() / 1000 - params.ts);
    const d = Math.floor(diff / 86400);
    const h = Math.floor((diff % 86400) / 3600);
    const m = Math.floor((diff % 3600) / 60);
    const ago = d > 0 ? (d + ' kun oldin') : h > 0 ? (h + ' soat oldin')
                                                   : (m + ' daqiqa oldin');
    parts.push(ago + ' yozilgan');
  }
  return parts.join(' · ');
}

/** Qisqa holat xabari (yuborilmoqda / xato) */
function showToast(text, isError) {
  let el = document.getElementById('toast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'toast';
    el.className = 'toast';
    document.body.appendChild(el);
  }
  el.textContent = text;
  el.classList.toggle('err', !!isError);
  el.classList.add('on');
  return el;
}

/** Botga javob yuborish: {a: yes|later|stop|reply, l: id, o, t} */
function sendAnswer(a, o, t) {
  if (!tg || !tg.sendData) {
    showToast('Faqat Telegram ilovasida ishlaydi', true);
    return;
  }
  const payload = { a: a, l: String(params.letterId || ''), o: o || '' };
  if (t) payload.t = t.slice(0, 300);
  try {
    if (a === 'reply') showToast('Yuborilmoqda…');
    tg.sendData(JSON.stringify(payload));
  } catch (e) {
    showToast('Yuborilmadi. Qayta urinib ko‘ring', true);
  }
}

/** Javob tugmalari + tayyor shablonlar (bir bosishda to‘ldirish) */
function buildAnswers() {
  const box = document.getElementById('answers');
  if (!box) return;
  box.innerHTML = '';
  if (!tg || !params.letterId) return;         // brauzerda javob yo'q
  let sel = params.offers[0] || '';

  if (params.offers.length > 1) {
    const opt = document.createElement('div');
    opt.className = 'opt';
    params.offers.forEach((o, i) => {
      const b = document.createElement('button');
      b.textContent = o;
      if (i === 0) b.classList.add('sel');
      b.onclick = () => {
        opt.querySelectorAll('button').forEach((x) => x.classList.remove('sel'));
        b.classList.add('sel');
        sel = o;
      };
      opt.appendChild(b);
    });
    box.appendChild(opt);
  }

  const mk = (label, cls, fn) => {
    const b = document.createElement('button');
    b.className = 'btn ' + cls;
    b.textContent = label;
    b.onclick = fn;
    box.appendChild(b);
    return b;
  };

  mk('❤️ Yarashamiz', 'btn-main', () => {
    if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('heavy');
    showToast('Yuborilmoqda…');
    sendAnswer('yes', sel);
  });

  mk('✍️ Javob yozish', 'btn-ghost', () => {
    box.innerHTML = '';
    const rows = document.createElement('div');
    rows.className = 'tpl-row';
    REPLY_TEMPLATES.forEach((tpl) => {
      const chip = document.createElement('button');
      chip.className = 'tpl';
      chip.textContent = tpl.label;
      chip.onclick = () => { ta.value = tpl.text; ta.focus(); };
      rows.appendChild(chip);
    });
    box.appendChild(rows);
    const ta = document.createElement('textarea');
    ta.placeholder = 'Javobingizni yozing (300 belgigacha)...';
    ta.maxLength = 300;
    box.appendChild(ta);
    mk('Yuborish', 'btn-main', () => {
      const t = ta.value.trim();
      if (!t) return showToast('Matn bo‘sh', true);
      showToast('Yuborilmoqda…');
      sendAnswer('reply', sel, t);
    });
    mk('Orqaga', 'btn-ghost', buildAnswers);
  });

  mk('⏳ Keyinroq', 'btn-ghost', () => {
    showToast('Yuborilmoqda…');
    sendAnswer('later', sel);
  });
  mk('🚫 Boshqa xat olmayman', 'btn-ghost danger', () => {
    if (confirm('Bu odam sizga boshqa xat yozmasinmi?')) sendAnswer('stop', sel);
  });
}

/* --- barmoq bilan 3D aylantirish + konvertni bosish --- */
function pointerDown(e) {
  Director.dragging = true;
  const p = e.touches ? e.touches[0] : e;
  Director.lastX = p.clientX; Director.lastY = p.clientY;
}
function pointerMove(e) {
  if (!Director.dragging) return;
  const p = e.touches ? e.touches[0] : e;
  const dx = p.clientX - Director.lastX, dy = p.clientY - Director.lastY;
  Director.lastX = p.clientX; Director.lastY = p.clientY;
  Director.rotY += dx * 0.008;
  Director.targetRotX = MathX.clamp(Director.targetRotX + dy * 0.004, -0.6, 0.6);
  Director.dragSpin += dx * 0.0006;
}
function pointerUp() { Director.dragging = false; }

/* WebAudio: konvert bosilganda qisqa "shimgir" (fayl kerak emas) */
function openChime() {
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const ac = new AC();
    [659.25, 880.0, 1174.66].forEach((f, i) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = 'triangle'; o.frequency.value = f;
      const t0 = ac.currentTime + i * 0.09;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.16, t0 + 0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.6);
      o.connect(g); g.connect(ac.destination);
      o.start(t0); o.stop(t0 + 0.65);
    });
    setTimeout(() => { try { ac.close(); } catch (e) { /* jim */ } }, 1400);
  } catch (e) { /* jim */ }
}
/* =============================================================================
   QATLAM 12 — YUBORUVCHI VIDEOSI (Instagram/YouTube/boshqa havola)
   Musiqa tanlash olib tashlandi: o'rniga yuboruvchi video havola qo'yadi.
   ========================================================================== */

/** XSS himoyasi: matnni escape qilish */
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[c]));
}

/* =============================================================================
   QATLAM 12b — MEDIA: yuboruvchi qoldirgan syurpriz ("Meni oching")
   Yuboruvchi havola qo'yadi yoki telefonidan fayl tanlaydi; qabul qiluvchi
   "Ochish" bosganda video/audio inline ochiladi yoki havola Telegramda ochiladi.
   ========================================================================== */
const DIRECT_MEDIA = /\.(mp4|webm|ogv|mov|m4v|mp3|m4a|aac|ogg|wav)(\?|#|$)/i;
const DIRECT_AUDIO = /\.(mp3|m4a|aac|ogg|wav)(\?|#|$)/i;

class MediaSection {
  constructor() { this.card = null; }

  /**
   * Havolani ochish. `host` — tugma yoki karta (inline video uchun).
   * Instagram/YouTube/boshqa havola → Telegram ichida ochiladi.
   */
  open(host) {
    const url = params.media;
    if (!url) return;
    if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
    if (!DIRECT_MEDIA.test(url)) {                 // Instagram/YouTube/…
      if (tg && tg.openLink) tg.openLink(url);
      else window.open(url, '_blank');
      return;
    }
    /* to'g'ridan-to'g'ri fayl (mp4/mp3) — inline ochamiz */
    const isAudio = DIRECT_AUDIO.test(url);
    const el = document.createElement(isAudio ? 'audio' : 'video');
    el.controls = true; el.autoplay = true; el.playsInline = true;
    el.src = encodeURI(url);
    if (this.card && this.card !== host) {
      this.card.appendChild(el);
      const op = this.card.querySelector('#mediaOpen');
      if (op) op.style.display = 'none';
    } else {
      const box = document.createElement('div');
      box.className = 'sheet on';
      box.appendChild(el);
      const close = document.createElement('button');
      close.className = 'btn btn-ghost';
      close.style.marginTop = '10px';
      close.textContent = 'Yopish';
      close.onclick = () => { box.classList.remove('on'); setTimeout(() => box.remove(), 450); };
      box.appendChild(close);
      document.body.appendChild(box);
    }
    if (host && host.id === 'videoBtn') host.style.display = 'none';
  }
}
const mediaSection = new MediaSection();

function startCountdown(atSec) {
  UI.hint.classList.add('on');

    const left = atSec - Math.floor(Date.now() / 1000);
    if (left <= 0) {
      UI.hint.classList.remove('on');
      UI.forYou.classList.add('on');
      return false;
    }
    const d = Math.floor(left / 86400), h = Math.floor((left % 86400) / 3600);
    UI.hint.textContent = '⏳ Bu xat ' + (d > 0 ? d + ' kun ' : '') + h +
                          ' soatdan keyin ochiladi';
    return true;
  };
  if (tickCd()) setInterval(tickCd, 30000);
}

    '<input id="fMediaTitle" placeholder="Sarlavha (masalan: «Meni bos»)" ' +
    FIELD_CSS + 'maxlength="60">' +
    '<div class="row" style="gap:8px"><button class="btn btn-main" id="fGo">Boshlash</button></div>' +
    '<button class="btn btn-ghost" id="fCopy" style="margin-top:10px">' +
    '🔗 Tayyor havolani nusxalash</button>' +
    '<p class="meta" style="text-transform:none;letter-spacing:0;line-height:1.5;margin-top:12px">' +
    'Havolani juftingizga yuboring: u ochganda animatsiya va «Meni bos» tugmasi ' +
    'birga ochiladi. Instagram/YouTube havolasi bosilganda Telegram ichida ochiladi.</p>';
  document.body.appendChild(box);
  requestAnimationFrame(() => box.classList.add('on'));

  box.querySelector('#fGo').onclick = () => {
    readFormFields(box);
    box.classList.remove('on');
    setTimeout(() => box.remove(), 450);
    replay();
  };
  box.querySelector('#fCopy').onclick = async () => {
    readFormFields(box);
    const url = buildShareUrl();
    try {
      await navigator.clipboard.writeText(url);
      box.querySelector('#fCopy').textContent = '✅ Nusxalandi!';
    } catch (e) {
      prompt('Havolani nusxalang:', url);
    }
  };
}

/** Forma maydonlarini params ga o'qish */
function readFormFields(box) {
  const get = (id) => (box.querySelector('#' + id) || {}).value || '';
  params.name = get('fName').trim().slice(0, 40);
  params.text = get('fText').trim().slice(0, 1000);
  const v = get('fMedia').trim();
  params.media = /^https?:\/\//i.test(v) ? v.slice(0, 500) : '';
  params.mediaTitle = get('fMediaTitle').trim().slice(0, 60);
}

/** Tayyor havola: animatsiya + video havola birga */
function buildShareUrl() {
  const u = new URL(location.href.split('?')[0]);
  if (params.name) u.searchParams.set('name', params.name);
  if (params.text) u.searchParams.set('text', params.text.slice(0, 900));
  if (params.theme) u.searchParams.set('theme', params.theme);
  if (params.media) u.searchParams.set('v', params.media);
  if (params.mediaTitle) u.searchParams.set('vt', params.mediaTitle);
  return u.toString();
}

/* =============================================================================
   QATLAM 14 — BOOT: hodisalar, Telegram init, reduced-motion, debug
   ========================================================================== */
function bindEvents() {
  CANVAS.addEventListener('pointerdown', pointerDown);
  window.addEventListener('pointermove', pointerMove);
  window.addEventListener('pointerup', pointerUp);
  window.addEventListener('touchstart', pointerDown, { passive: true });
  window.addEventListener('touchmove', pointerMove, { passive: true });
  window.addEventListener('touchend', pointerUp);
  CANVAS.addEventListener('click', () => {
    if (Director.phase === PHASE.ENVELOPE && !Director.started) startAnimation();
  });
  /* ikki marta bosish → animatsiyani o'tkazib yuborish (spec 6.1) */
  CANVAS.addEventListener('dblclick', skipAnimation);
  let lastTap = 0;
  CANVAS.addEventListener('touchend', () => {
    const now = Date.now();
    if (now - lastTap < 320) skipAnimation();
    lastTap = now;
  });
  window.addEventListener('resize', () => Viewport.resize());
  window.addEventListener('orientationchange',
    () => setTimeout(() => Viewport.resize(), 200));

  UI.read.onclick = openSheet;
  document.getElementById('closeSheet').onclick = () => UI.sheet.classList.remove('on');
  document.getElementById('replayBtn').onclick = replay;
  document.getElementById('shareBtn').onclick = shareLetter;
  /* "Meni bos" — yuboruvchi qo'ygan video/syurpriz havolani ochadi */
  UI.video.onclick = () => mediaSection.open(UI.video);
}

function boot() {
  Theme.pick(params.theme);         // tema foni + konvert ranglari darhol
  Viewport.resize();
  Particles.applyShape(envelopeShape(Particles.n), 0);
  Particles.hideFrom(Config.ENVELOPE_VISIBLE);
  UI.forYou.classList.add('on');
  UI.forYouSub.textContent = params.name ? ('sizga: ' + params.name)
                                         : 'sizga yozilgan xat';
  UI.hint.classList.add('on');
  bindEvents();

  if (tg) {
    try { tg.ready(); tg.expand(); } catch (e) { /* jim */ }
    try {
      if (tg.setHeaderColor) tg.setHeaderColor('#0d0010');
      if (tg.setBackgroundColor) tg.setBackgroundColor('#0d0010');
    } catch (e) { /* jim */ }
  }

  loadFromServer();
  if (params.at && params.at > Date.now() / 1000) startCountdown(params.at);
  if (!params.text && !params.letterId) showForm();

  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduced) {
    Director.started = true;
    Director.phase = PHASE.IDLE;
    Particles.applyShape(roseShape(Particles.n), 0);
    revealName();
    showTools();
  }
  requestAnimationFrame((t) => Director.frame(t));
}

boot();

/* Test/avtomatlashtirish uchun debug interfeys */
window.__letter = {
  particles: Particles.n,
  start: startAnimation,
  replay,
  phase: () => Director.phase,
  name: nameText,
  text: () => params.text,
  video: () => params.media,
};
</script>
