<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1b0929">
<title>Yarashamiz ❤️</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=10">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

<div id="splash" class="splash-screen" aria-hidden="true">
  <div class="splash-inner">
    <svg class="splash-logo" viewBox="0 0 120 120" fill="none" aria-hidden="true">
      <defs>
        <linearGradient id="lgSplash" x1="16" y1="8" x2="104" y2="112">
          <stop offset="0" stop-color="#ff9fc2"/>
          <stop offset="45%" stop-color="#f7c98b"/>
          <stop offset="100%" stop-color="#a06bff"/>
        </linearGradient>
      </defs>
      <circle class="sp-halo" cx="60" cy="58" r="44"/>
      <path class="sp-heart"
        d="M60 46C50 35 33 39 33 54c0 12 14 22 27 31 13-9 27-19 27-31 0-15-17-19-27-8z"/>
      <rect class="sp-env" x="30" y="66" width="60" height="38" rx="7"/>
      <path class="sp-env2" d="M31 70l29 20 29-20"/>
      <circle class="sp-dot" cx="98" cy="24" r="2.4"/>
      <circle class="sp-dot sp-dot2" cx="20" cy="33" r="1.8"/>
      <circle class="sp-dot sp-dot3" cx="103" cy="86" r="1.6"/>
    </svg>
    <div class="splash-brand">Yarashamiz</div>
    <div class="splash-sub">sevgi bilan yozilgan xatlar</div>
    <div class="splash-bar"><i></i></div>
  </div>
</div>

<div class="hearts" aria-hidden="true"></div>

<div id="app" class="app">
  <header class="top">
    <div class="brand">💌 Yarashamiz</div>
    <div class="pill" id="pill">—</div>
  </header>

  <main id="view" class="view"><div class="splash">Yuklanmoqda…</div></main>

  <nav class="tabs" id="tabs">
    <button data-tab="write" class="on">✍️<span>Yozish</span></button>
    <button data-tab="me">📊<span>Hisobim</span></button>
    <button data-tab="games">🎮<span>O'yinlar</span></button>
    <button data-tab="memory">📖<span>Xotiralar</span></button>
    <button data-tab="garden">🌱<span>Bog'im</span></button>
  </nav>
</div>

<canvas id="confetti"></canvas>
<script src="app.js?v=10"></script>
</body>
</html>
